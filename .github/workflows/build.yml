name: Build and package
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Jinja2>=2.7,<4"
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Build and simulate (Linux)
        if: runner.os == 'Linux'
        run: bash tools/build_linux.sh
      - name: Build and simulate (Windows)
        if: runner.os == 'Windows'
        run: python tools/build_windows.py
      - run: python -m unittest discover -s tests -p test_packaging.py
      - run: python tools/package.py
      - name: Relocated package smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/relocated app"
          unzip -q dist/OVMiniBrain-linux-x64.zip -d "$RUNNER_TEMP/relocated app"
          cd "$RUNNER_TEMP"
          bash "$RUNNER_TEMP/relocated app/OVMiniBrain-linux-x64/run_motion.sh" left_jab --headless --max-steps 60
      - name: Relocated package smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive dist/OVMiniBrain-windows-x64.zip "$env:RUNNER_TEMP/relocated app"
          Set-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP/relocated app/OVMiniBrain-windows-x64/run_motion.cmd" left_jab --headless --max-steps 60
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: OVMiniBrain-${{ runner.os }}-x64
          path: dist/*.zip
